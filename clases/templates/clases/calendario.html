{% extends 'dashboard/base.html' %}
{% load static %}

{% block content %}
<div class="mb-4 flex flex-wrap gap-2 items-center">
    <!-- Filtro por docente -->
    <div>
        <input type="text" id="docente_filter_search" class="swal2-input" placeholder="Buscar docente..." style="width: 180px; display: inline-block; margin-bottom: 2px;">
        <select id="filter-docente" class="swal2-input" style="width: 200px; display: inline-block;">
            <option value="">Todos los docentes</option>
        </select>
    </div>
    <!-- Filtro por carrera -->
    <div>
        <select id="filter-carrera" class="swal2-input" style="width: 200px; display: inline-block;">
            <option value="">Todas las carreras</option>
            <!-- Las opciones se llenan dinámicamente en JS -->
        </select>
    </div>
</div>
<div id="calendario" class="bg-white dark:bg-[#444] text-black dark:text-white p-2 sm:p-4 rounded-lg shadow-md w-full max-w-full overflow-x-auto">
    <div id="calendar" class="bg-gray-100 dark:bg-[#2e2e2e] p-1 sm:p-4 rounded-lg w-full min-w-[320px]"></div>
    <div class="text-xs mt-2 text-gray-500">Si selecciona "Repetir hasta", la clase se registrará automáticamente todos los días de la semana coincidentes hasta la fecha indicada.</div>
</div>
<!-- FullCalendar -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.js"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<!-- Calendario CSS -->
<link rel="stylesheet" href="{% static 'clases/css/calendario.css' %}">
<script id="docentes-json" type="application/json">{{ docentes_json|safe }}</script>
<script id="materias-json" type="application/json">{{ materias_json|safe }}</script>
<script id="aulas-json" type="application/json">{{ aulas_json|safe }}</script>
<script id="clases-json" type="application/json">{{ clases_json|safe }}</script>
<script>
    window.ES_STAFF = {% if es_staff %}true{% else %}false{% endif %};
    window.USER_ID = {{ user_id|default:'null' }};
    window.DOCENTES_LIST = {{ docentes_json|safe }};
</script>
<!-- JS personalizado -->
<script src="{% static 'clases/js/calendario.js' %}"></script>
{% endblock %}
