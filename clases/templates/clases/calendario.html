{% extends 'dashboard/base.html' %}
{% load static %}

{% block content %}
<div id="calendario" class="bg-white dark:bg-[#444] text-black dark:text-white p-2 sm:p-4 rounded-lg shadow-md w-full max-w-full overflow-x-auto">
    <div id="calendar" class="bg-gray-100 dark:bg-[#2e2e2e] p-1 sm:p-4 rounded-lg w-full min-w-[320px]"></div>
</div>

<!-- FullCalendar -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.js"></script>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<!-- Calendario CSS -->
<link rel="stylesheet" href="{% static 'clases/css/calendario.css' %}">

<script id="docentes-json" type="application/json">{{ docentes_json|safe }}</script>
<script id="materias-json" type="application/json">{{ materias_json|safe }}</script>
<script id="aulas-json" type="application/json">{{ aulas_json|safe }}</script>
<script id="clases-json" type="application/json">{{ clases_json|safe }}</script>
<script>
    window.ES_STAFF = {% if es_staff %}true{% else %}false{% endif %};
    window.USER_ID = {{ user_id|default:'null' }};
</script>

<!-- JS personalizado -->
<script src="{% static 'clases/js/calendario.js' %}"></script>
{% endblock %}
