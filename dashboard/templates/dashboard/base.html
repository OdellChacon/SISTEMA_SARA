{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}?v=1">
    <link rel="stylesheet" href="{% static 'docentes/css/docentes.css' %}">
    <script src="{% static 'js/dashboard.js' %}" defer></script>
    <script src="{% static 'docentes/js/docentes.js' %}" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- FullCalendar CSS y JS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.js"></script>
    <!-- Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/boxicons/css/boxicons.min.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script> <!-- Aquí agregamos Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @media (max-width: 768px) {
            .sidebar {
                display: none !important;
            }
        }
    </style>
</head>
<body id="body" class="{% if request.COOKIES.dark_mode == 'true' %}dark{% endif %}">
    <!-- Botón hamburguesa solo en móvil -->
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Abrir menú">
        <i class="bx bx-menu"></i>
    </button>
    <div class="dashboard-container" id="dashboard">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span id="sidebar-logo" class="logo-text">SARA</span>
                <!-- Botón cerrar sidebar en móvil -->
                <button class="close-btn" id="closeSidebarBtn" aria-label="Cerrar menú" style="display:none;">
                    <i class="bx bx-x"></i>
                </button>
            </div>
            <ul>
                {% if user.is_superuser or user.is_staff %}
                <li>
                    <i class='bx bx-home'></i>
                    <a href="{% url 'admin_dashboard' %}" style="text-decoration: none; color: inherit;">
                        <span>Inicio</span>
                    </a>
                </li>
                <li>
                    <i class='bx bx-building'></i>
                    <a href="{% url 'aulas_list' %}" style="text-decoration: none; color: inherit;">
                        <span>Aulas</span>
                    </a>
                </li>
                <li>
                    <i class='bx bx-book'></i>
                    <a href="{% url 'materias_list' %}" style="text-decoration: none; color: inherit;">
                        <span>Materias</span>
                    </a>
                </li>
                <li>
                    <i class='bx bx-calendar'></i>
                    <a href="{% url 'calendario' %}" style="text-decoration: none; color: inherit;">
                        <span>Clases</span>
                    </a>
                </li>
                {% if user.is_superuser %}
                <li>
                    <i class='bx bx-user'></i>
                    <a href="{% url 'docentes_list' %}" style="text-decoration: none; color: inherit;">
                        <span>Docentes</span>
                    </a>
                </li>
                {% endif %}
                {% else %}
                <li>
                    <i class='bx bx-calendar'></i>
                    <a href="{% url 'calendario' %}" style="text-decoration: none; color: inherit;">
                        <span>Clases</span>
                    </a>
                </li>
                {% endif %}
                <li>
                    <i class='bx bx-log-out'></i>
                    <form action="{% url 'logout' %}" method="post" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit" style="background: none; border: none; color: inherit; cursor: pointer;">
                            <span>Cerrar Sesión</span>
                        </button>
                    </form>
                </li>
            </ul>
            
            <!-- 
            <div class="theme-toggle" onclick="toggleTheme()">
                <i class="bx bx-moon" id="theme-icon"></i>
            </div>
            -->
        </div>

        <!-- Contenido -->
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
    <script>
        // Sidebar responsive JS
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.getElementById('sidebar');
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const closeSidebarBtn = document.getElementById('closeSidebarBtn');
            function openSidebar() {
                sidebar.classList.add('active');
                closeSidebarBtn.style.display = 'inline-block';
            }
            function closeSidebar() {
                sidebar.classList.remove('active');
                closeSidebarBtn.style.display = 'none';
            }
            hamburgerBtn && hamburgerBtn.addEventListener('click', openSidebar);
            closeSidebarBtn && closeSidebarBtn.addEventListener('click', closeSidebar);
            // Cerrar sidebar al hacer click fuera en móvil
            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768 && sidebar.classList.contains('active')) {
                    if (!sidebar.contains(e.target) && e.target !== hamburgerBtn) {
                        closeSidebar();
                    }
                }
            });
        });
    </script>
</body>
</html>
