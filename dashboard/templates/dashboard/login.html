{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <div class="form-box login">
            <form id="loginForm">
                {% csrf_token %}
                <h1>SARA</h1>
                <div class="input-box">
                    <input type="email" id="correo" name="correo" placeholder="Correo" required>
                    <i class='bx bxs-envelope'></i> <!-- Icono de correo -->
                </div>
                <div class="input-box">
                    <input type="password" id="cedula" name="cedula" placeholder="Cédula" required>
                    <i class='bx bxs-id-card'></i> <!-- Icono de identificación -->
                </div>
                <div class="forgot-link">
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const correo = document.getElementById('correo').value;
            const cedula = document.getElementById('cedula').value;

            fetch("{% url 'login' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify({ correo, cedula })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    Swal.fire('Éxito', 'Inicio de sesión exitoso.', 'success').then(() => {
                        window.location.href = "{% url 'dashboard' %}";
                    });
                } else {
                    Swal.fire('Error', data.message || 'Credenciales incorrectas.', 'error');
                }
            })
            .catch(error => {
                Swal.fire('Error', 'Ocurrió un problema al iniciar sesión.', 'error');
                console.error(error);
            });
        });
    </script>
</body>
</html>
